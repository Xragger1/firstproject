<!DOCTYPE html>
<html>
<head>
  <title>Course Registration Form</title>
</head>
<body>
  <h2>Student Course Registration</h2>
  <form action="/register" method="post">
    <!-- Student Name -->
    <label for="studentName">Full Name:</label>
    <input type="text" id="studentName" name="studentName" required><br><br>

    <!-- Student Email -->
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <!-- Student ID -->
    <label for="studentId">Student ID:</label>
    <input type="text" id="studentId" name="studentId" required><br><br>

    <!-- Course Selection -->
    <label for="course">Select Course:</label>
    <select id="course" name="course" required>
      <option value="">--Choose a course--</option>
      <option value="math101">Math 101</option>
      <option value="cs102">Computer Science 102</option>
      <option value="eng103">English Literature 103</option>
      <option value="phy104">Physics 104</option>
    </select><br><br>

    <!-- Year of Study -->
    <label>Year of Study:</label><br>
    <input type="radio" id="year1" name="year" value="1">
    <label for="year1">Year 1</label><br>
    <input type="radio" id="year2" name="year" value="2">
    <label for="year2">Year 2</label><br>
    <input type="radio" id="year3" name="year" value="3">
    <label for="year3">Year 3</label><br>
    <input type="radio" id="year4" name="year" value="4">
    <label for="year4">Year 4</label><br><br>

    <!-- Submit Button -->
    <button type="submit">Register</button>
  </form>
</body>
</html>
